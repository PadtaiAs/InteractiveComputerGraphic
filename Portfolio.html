<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>


    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/EXRLoader.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.7/dat.gui.min.js"></script>

    <script>
        // ==========================================
        // 0. GLSL SHADERS (ถอดรูปแบบจาก 700_shader)
        // ==========================================

        // Cel Shading Vertex Shader
        const celVertexShader = `
            uniform float uTime;
            varying vec2 vUv;
            varying vec3 vNormal;
            varying vec3 vPosW;

            void main() {
                vUv = uv;
                vNormal = normalMatrix * normal;
                vec4 worldPos = modelMatrix * vec4(position, 1.0);
                vPosW = worldPos.xyz;

                gl_Position = projectionMatrix * viewMatrix * worldPos;
            }
        `;

        // Cel Shading Fragment Shader
        const celFragmentShader = `
            precision mediump float;

            uniform float uTime;
            uniform sampler2D uTexture;
            uniform vec3 uLightDirection;
            uniform vec3 uBaseColor;

            varying vec2 vUv;
            varying vec3 vNormal;
            varying vec3 vPosW;

            void main() {
                vec3 N = normalize(vNormal);
                vec3 L = normalize(uLightDirection);

                // Lambert diffuse shading (Cel Shading Level)
                float diffuse = max(dot(N, L), 0.0);
                float level = 6.0;
                diffuse = floor(diffuse * level) / level;

                // Ambient light
                float ambient = 0.3;

                // Phong specular shading (Smoothstep Cel)
                vec3 R = reflect(-L, N);
                vec3 V = normalize(cameraPosition - vPosW);
                float specular = pow(max(dot(R, V), 0.0), 4.0) * 0.8;
                specular = smoothstep(0.1, 0.2, specular);

                vec3 color = uBaseColor * (diffuse + ambient) + vec3(specular);
                gl_FragColor = vec4(color, 1.0);
            }
        `;

        // Realtime Wave Vertex Shader
        const waveVertexShader = `
            uniform float uTime;
            varying vec2 vUv;
            void main() {
                vUv = uv;
                vec3 pos = position;
                // คำนวณคลื่นลื่นไหลแบบ Realtime ด้วย sine wave
                pos.z += sin(pos.x * 5.0 + uTime) * 0.1;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
            }
        `;

        const waveFragmentShader = `
            varying vec2 vUv;
            void main() {
                // สีส้มล้วน (ไม่มีเส้น Grid)
                gl_FragColor = vec4(1.0, 0.4, 0.0, 1.0);
            }
        `;

        // 1. Renderer Setup
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputEncoding = THREE.sRGBEncoding;
        document.body.appendChild(renderer.domElement);

        // 2. Scene Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xfcf5ec);

        // 3. Camera & Controls
        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(-25, 15, 0);
        camera.lookAt(0, 0, 0);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // 4. Lighting Setup
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.7);
        directionalLight.position.set(15, 20, 15);
        directionalLight.castShadow = true;

        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        directionalLight.shadow.bias = -0.0005;

        directionalLight.shadow.camera.near = 0.5;
        directionalLight.shadow.camera.far = 50;
        directionalLight.shadow.camera.left = -15;
        directionalLight.shadow.camera.right = 15;
        directionalLight.shadow.camera.top = 15;
        directionalLight.shadow.camera.bottom = -15;

        scene.add(directionalLight);

        // 5. Interactive Setup & Target Mapping
        const TOGGLE_TARGETS = {
            Aboutme: { start: 'Aboutme', end: 'AboutmeEnd' },
            AboutmeEnd: { start: 'Aboutme', end: 'AboutmeEnd' },
            Projects: { start: 'Projects', end: 'ProjectsEnd' },
            ProjectsEnd: { start: 'Projects', end: 'ProjectsEnd' },
            Skills: { start: 'Skills', end: 'SkillsEnd' },
            SkillsEnd: { start: 'Skills', end: 'SkillsEnd' }
        };

        const pickables = [];
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        const ZOOM_PADDING = 1.6;

        const home_position = camera.position.clone();
        const home_target = controls.target.clone();
        const focus_target = controls.target.clone();
        const camera_goal = camera.position.clone();
        let moving = false;

        const currentTargetState = {
            Aboutme: 'Aboutme',
            Projects: 'Projects',
            Skills: 'Skills'
        };

        function lerp(a, b, t) {
            return ((1.0 - t) * a) + (t * b);
        }

        function getPickableRoot(obj) {
            while (obj) {
                if (Object.prototype.hasOwnProperty.call(TOGGLE_TARGETS, obj.name)) return obj;
                obj = obj.parent;
            }
            return null;
        }

        function resetView() {
            focus_target.copy(home_target);
            camera_goal.copy(home_position);
            moving = true;
        }

        function zoomTo(target) {
            const box = new THREE.Box3().setFromObject(target);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());

            const radius = Math.max(size.x, size.y, size.z) * 0.5;
            const fov = THREE.MathUtils.degToRad(camera.fov);
            const distance = Math.max((radius / Math.tan(fov / 2)) * ZOOM_PADDING, 1.0);

            const dir = camera.position.clone().sub(center).normalize();

            focus_target.copy(center);
            camera_goal.copy(center).add(dir.multiplyScalar(distance));
            moving = true;
        }

        controls.addEventListener('start', () => { moving = false; });


        const celUniforms = {
            uTime: { value: 0.0 },
            uLightDirection: { value: new THREE.Vector3(0.4, 1, 1).normalize() },
            uBaseColor: { value: new THREE.Vector3(1.0, 0.4, 0.0) }
        };

        const celSphereMat = new THREE.ShaderMaterial({
            vertexShader: celVertexShader,
            fragmentShader: celFragmentShader,
            uniforms: celUniforms
        });

        const celSphere = new THREE.Mesh(new THREE.SphereBufferGeometry(1.2, 32, 32), celSphereMat);
        celSphere.position.set(7, 4.5, -5.5);
        celSphere.castShadow = true;
        celSphere.name = "CelSphere";
        scene.add(celSphere);

        // วัตถุ Vertex Shader realtime
        const waveUniforms = {
            uTime: { value: 0.0 }
        };

        const waveMat = new THREE.ShaderMaterial({
            vertexShader: waveVertexShader,
            fragmentShader: waveFragmentShader,
            uniforms: waveUniforms,
            side: THREE.DoubleSide
        });

        const waveFlag = new THREE.Mesh(new THREE.PlaneGeometry(2, 2, 30, 20), waveMat);
        waveFlag.position.set(7, 4.5, 5.5);
        waveFlag.castShadow = true;
        waveFlag.name = "WaveFlag";
        scene.add(waveFlag);

        // ==========================================
        // 6. Animation Variables & Model Loading
        // ==========================================
        const clock = new THREE.Clock();
        let mixer;

        const animationNames = [
            'TextAction',
            'ConeAction',
            'CylinderAction',
            'Plane.009Action',
            'Plane.016Action',
            'Plane.017Action',
            'Text.001Action',
            'Text.002Action',
            'TorusAction'
        ];

        const loader = new THREE.GLTFLoader();
        loader.load('https://padtaias.github.io/InteractiveComputerGraphic/padtaiPortfolio.glb', (gltf) => {
            const model = gltf.scene;
            model.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                    pickables.push(child);
                }
            });
            model.position.set(0, 0, 0);
            scene.add(model);

            // Setup Animation Mixer
            mixer = new THREE.AnimationMixer(model);

            animationNames.forEach((name) => {
                const clip = THREE.AnimationClip.findByName(gltf.animations, name);
                if (clip) {
                    mixer.clipAction(clip).play();
                }
            });
        });

        // 7. Event Listeners (Pointer & Keyboard)
        function onPick(e) {
            const r = renderer.domElement.getBoundingClientRect();
            const x = e.clientX - r.left;
            const y = e.clientY - r.top;
            pointer.x = (x / r.width) * 2 - 1;
            pointer.y = -(y / r.height) * 2 + 1;

            raycaster.setFromCamera(pointer, camera);
            const hit = raycaster.intersectObjects(pickables, false)[0];

            if (!hit) return;

            const root = getPickableRoot(hit.object);
            if (!root) return;

            const groupKey = TOGGLE_TARGETS[root.name].start;
            const currentState = currentTargetState[groupKey];

            const nextState = (currentState === TOGGLE_TARGETS[root.name].start)
                ? TOGGLE_TARGETS[root.name].end
                : TOGGLE_TARGETS[root.name].start;

            const targetObj = scene.getObjectByName(nextState);

            if (targetObj) {
                currentTargetState[groupKey] = nextState;
                zoomTo(targetObj);
                console.log(`Toggled [${groupKey}]: ${currentState} -> ${nextState}`);
            } else {
                console.warn(`Object "${nextState}" not found in scene!`);
            }
        }

        let down = { x: 0, y: 0 };
        renderer.domElement.addEventListener('pointerdown', (e) => {
            down = { x: e.clientX, y: e.clientY };
        });

        renderer.domElement.addEventListener('pointerup', (e) => {
            if (Math.hypot(e.clientX - down.x, e.clientY - down.y) < 5) {
                onPick(e);
            }
        });

        window.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                resetView();
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        });

        // ==========================================
        // 8. Animation Loop
        // ==========================================
        function animate() {
            const delta = clock.getDelta();
            const elapsedTime = clock.getElapsedTime();

            if (mixer) mixer.update(delta);

            // อัปเดตค่า uTime เข้าไปยัง Shader ทั้งสอง
            celUniforms.uTime.value = elapsedTime;
            waveUniforms.uTime.value = elapsedTime;

            if (typeof celSphere !== 'undefined') {
                celSphere.rotation.y += 0.01;
            }

            if (moving) {
                controls.target.lerp(focus_target, 0.1);
                camera.position.x = lerp(camera.position.x, camera_goal.x, 0.01);
                camera.position.y = lerp(camera.position.y, camera_goal.y, 0.01);
                camera.position.z = lerp(camera.position.z, camera_goal.z, 0.01);

                if (camera.position.distanceTo(camera_goal) < 0.01 &&
                    controls.target.distanceTo(focus_target) < 0.01) {
                    moving = false;
                }
            }

            controls.update();
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        animate();
    </script>

</body>

</html>
