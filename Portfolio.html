<!DOCTYPE html>
<html>

<head>
    <title>My Portfolio</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

.portfolio-card {
    position: absolute;
    top: 24px;
    left: 24px;
    width: 320px;
    background: rgba(255, 252, 247, 0.94);
    border: 2px solid #e2cbb4;
    border-radius: 18px;
    box-shadow: 0 10px 25px rgba(184, 137, 95, 0.2);
    backdrop-filter: blur(8px);
    padding: 18px;
    color: #5c4738;
    font-family: sans-serif;
    z-index: 10;
    user-select: none;
}

.card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 2px dashed #ebd6c1;
    padding-bottom: 10px;
    margin-bottom: 12px;
}

.card-title {
    font-size: 14px;
    font-weight: bold;
    color: #8c5d3d;
}

.window-dots {
    display: flex;
    gap: 6px;
}

.dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
}
.dot-red { background: #f28b82; }
.dot-yellow { background: #fdd663; }
.dot-green { background: #81c995; }

.badge {
    display: inline-block;
    background: #faeedb;
    color: #b56c35;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 600;
    margin-bottom: 6px;
}

.user-name {
    font-size: 18px;
    font-weight: bold;
    color: #433022;
    margin: 0 0 4px 0;
}

.student-id {
    font-size: 13px;
    color: #9c7a5f;
    margin-bottom: 12px;
}

.info-box {
    background: #fff8f0;
    border: 1px solid #f0decb;
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 12.5px;
    line-height: 1.6;
    color: #634b39;
}

.info-row {
    display: flex;
}

.info-label {
    width: 55px;
    flex-shrink: 0;
    color: #a47854;
}
    </style>
</head>

<body>
    <div class="portfolio-card">
    <div class="card-header">
        <span class="card-title">✦ Student Portfolio</span>
        <div class="window-dots">
            <span class="dot dot-red"></span>
            <span class="dot dot-yellow"></span>
            <span class="dot dot-green"></span>
        </div>
    </div>

    <span class="badge">Computer Science</span>
    <h2 class="user-name">นายอภิสิทธิ์ สุมาวรรณ์</h2>
    <div class="student-id">รหัสนิสิต: 6721601613</div>

    <div class="info-box">
        <div class="info-row">
            <span class="info-label">สาขา:</span>
            <span>วิทยาการคอมพิวเตอร์</span>
        </div>
        <div class="info-row">
            <span class="info-label">คณะ:</span>
            <span>ศิลปศาสตร์และวิทยาศาสตร์</span>
        </div>
        <div class="info-row">
            <span class="info-label">สถาบัน:</span>
            <span>มหาวิทยาลัยเกษตรศาสตร์</span>
        </div>
    </div>
</div>
